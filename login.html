<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Estoque</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="tela-login">
    <div>
      <div id="avisos" class="avisos" role="status"></div>
      <section class="login">
        <h1>Entrar no estoque</h1>
        <p class="apoio">Use seu login e senha para acessar o sistema.</p>
        <form id="form-login" novalidate>
          <label for="login">Login</label>
          <input id="login" type="text" autocomplete="username" autofocus required>
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password" required>
          <button type="submit" class="btn btn-principal">Entrar</button>
        </form>
      </section>
    </div>
  </main>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
